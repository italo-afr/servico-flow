name: Imagens

# Constrói as imagens da API/worker e da web, faz smoke test com PostgreSQL real
# e só então publica no GitHub Container Registry (tag = commit).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  build-test-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: servicoflow
          POSTGRES_PASSWORD: servicoflow
          POSTGRES_DB: servicoflow_smoke
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U servicoflow"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build API (carregada localmente para o smoke test)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/containers/Dockerfile.api
          load: true
          tags: servicoflow-api:smoke
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Build web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/containers/Dockerfile.web
          load: true
          tags: servicoflow-web:smoke
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Smoke test (migration única, API, worker, métricas, web)
        env:
          DATABASE_URL: postgres://servicoflow:servicoflow@localhost:5432/servicoflow_smoke
        run: |
          set -euo pipefail
          SECRET=$(openssl rand -hex 32); KEY=$(openssl rand -hex 32)
          common=(--network host -e APP_ENV=ci -e DATABASE_URL -e PUBLIC_APP_URL=http://localhost:3000
                  -e SESSION_SECRET=$SECRET -e TOKEN_PAYLOAD_ENCRYPTION_KEY=$KEY -e RELEASE_SHA=${GITHUB_SHA})
          docker run --rm "${common[@]}" servicoflow-api:smoke node dist/db/migrate-cli.js
          docker run -d --name api "${common[@]}" servicoflow-api:smoke
          docker run -d --name worker "${common[@]}" -e STORAGE_LOCAL_DIR=/tmp/storage servicoflow-api:smoke node dist/worker/main.js
          docker run -d --name web --network host servicoflow-web:smoke
          for i in $(seq 1 30); do curl -fsS localhost:3001/api/v1/health/ready && break; sleep 2; done
          curl -fsS localhost:3001/api/v1/health/ready | grep '"status":"ok"'
          curl -fsS localhost:9464/metrics | grep -q servicoflow_http_requests_total
          sleep 5
          curl -fsS localhost:9465/metrics | grep -q servicoflow_outbox_processed_total
          curl -fsS localhost:9464/metrics | grep -E '^servicoflow_worker_heartbeat_age_seconds' 
          for i in $(seq 1 30); do curl -fsS -o /dev/null localhost:3000/ && break; sleep 2; done
          curl -fsS localhost:3000/ | grep -q 'ServiçoFlow'
          # o processo roda sem root
          test "$(docker exec api id -u)" != "0"
      - name: Logs em caso de falha
        if: failure()
        run: for c in api worker web; do echo "== $c"; docker logs $c 2>&1 | tail -50 || true; done

      - name: Login no GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar as mesmas imagens testadas
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          for app in api web; do
            for tag in "${GITHUB_SHA}" main; do
              docker tag servicoflow-$app:smoke "$REGISTRY/servicoflow-$app:$tag"
              docker push "$REGISTRY/servicoflow-$app:$tag"
            done
          done
          echo "### Imagens publicadas" >> "$GITHUB_STEP_SUMMARY"
          echo "- $REGISTRY/servicoflow-api:${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "- $REGISTRY/servicoflow-web:${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"

  demo-smoke:
    # Sobe a demo de um comando (infra/demo) com as imagens RECÉM-PUBLICADAS e percorre
    # login → convite → e-mail entregue no Mailpit, passando pelo Caddy.
    needs: build-test-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: docker compose up (demo)
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: docker compose -f infra/demo/docker-compose.yml up -d --wait --wait-timeout 180
      - name: Jornada mínima pela porta da demo
        run: |
          set -euo pipefail
          B=http://localhost:8080; O="Origin: http://localhost:8080"
          curl -fsS $B/ | grep -q 'ServiçoFlow'
          curl -fsS -c jar -H "$O" -H 'content-type: application/json' \
            -d '{"email":"ana@clima-norte.example.com","password":"demo-senha-123"}' $B/api/auth/sign-in/email > /dev/null
          ORG=$(curl -fsS -b jar $B/api/v1/me | jq -r '.memberships[0].organizationId')
          curl -fsS -b jar -H "$O" -H 'content-type: application/json' \
            -d '{"email":"nova.pessoa@example.com","role":"TECHNICIAN"}' $B/api/v1/organizations/$ORG/invitations > /dev/null
          for i in $(seq 1 30); do
            n=$(curl -fsS http://localhost:8025/api/v1/messages | jq '.total')
            [ "$n" -ge 1 ] && break; sleep 2
          done
          curl -fsS http://localhost:8025/api/v1/messages | jq -e '.messages[0].To[0].Address == "nova.pessoa@example.com"'
          echo "### Demo verificada: login, convite e e-mail entregue no Mailpit" >> "$GITHUB_STEP_SUMMARY"
      - name: Logs em caso de falha
        if: failure()
        run: docker compose -f infra/demo/docker-compose.yml logs --tail 80
