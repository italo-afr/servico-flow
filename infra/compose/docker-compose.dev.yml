# Dependências locais de desenvolvimento. A aplicação roda fora do Docker (pnpm dev).
# Uso: docker compose -f infra/compose/docker-compose.dev.yml up -d
name: servicoflow-dev
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: servicoflow
      POSTGRES_PASSWORD: servicoflow
      POSTGRES_DB: servicoflow_dev
    ports: ['127.0.0.1:5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'servicoflow']
      interval: 5s
      retries: 10
  mailpit:
    # Captura todos os e-mails localmente: http://localhost:8025
    image: axllent/mailpit:v1.27
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']
volumes:
  pgdata:
