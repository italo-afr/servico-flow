# Coleta das portas INTERNAS de métricas (não expostas pelo proxy).
global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
scrape_configs:
  - job_name: servicoflow-api
    static_configs:
      - targets: ['api:9464']
  - job_name: servicoflow-worker
    static_configs:
      - targets: ['worker:9465']
