# Alertmanager: agrupa e envia por e-mail. Preencha via variáveis do ambiente real.
# NÃO VERIFICADO com um servidor SMTP real (projeto de portfólio, sem hospedagem).
route:
  receiver: ops-email
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: ops-email
      repeat_interval: 1h
receivers:
  - name: ops-email
    email_configs:
      - to: ops@example.com
        from: alertas@example.com
        smarthost: mailpit:1025
        require_tls: false
        send_resolved: true
inhibit_rules:
  # Se a API caiu, não alertar também latência/erros dela.
  - source_matchers: [alertname="ApiDown"]
    target_matchers: [alertname=~"HighErrorRate|HighLatencyP95"]
